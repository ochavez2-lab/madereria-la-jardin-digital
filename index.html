<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maderería La Jardín — Ops</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <span class="brand">Maderería La Jardín</span>
    <nav>
      <button class="tab active" data-tab="gastos">Gastos</button>
      <button class="tab" data-tab="facebook">Facebook</button>
      <button class="tab" data-tab="resumen">Resumen</button>
    </nav>
  </header>

  <main>

    <!-- GASTOS HORMIGA -->
    <section id="gastos" class="panel active">
      <h2>Gastos Hormiga</h2>
      <form id="gasto-form">
        <input type="date" id="g-fecha" required>
        <select id="g-cat">
          <option value="combustible">Combustible</option>
          <option value="herramientas">Herramientas</option>
          <option value="papelería">Papelería</option>
          <option value="limpieza">Limpieza</option>
          <option value="comida">Comida</option>
          <option value="servicios">Servicios</option>
          <option value="otro">Otro</option>
        </select>
        <input type="number" id="g-monto" placeholder="Monto $MXN" min="0" step="0.01" required>
        <input type="text" id="g-desc" placeholder="Descripción" required>
        <button type="submit">+ Agregar</button>
      </form>
      <div id="gastos-alert" class="alert hidden"></div>
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Categoría</th>
            <th>Monto</th>
            <th>Descripción</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="gastos-body"></tbody>
      </table>
      <div class="kpi-row" id="gastos-kpis"></div>
    </section>

    <!-- FACEBOOK ADS -->
    <section id="facebook" class="panel">
      <h2>Campañas Facebook</h2>
      <form id="fb-form">
        <input type="text" id="fb-nombre" placeholder="Nombre campaña" required>
        <input type="date" id="fb-fecha" required>
        <input type="number" id="fb-presupuesto" placeholder="Presupuesto diario $" min="0" step="0.01" required>
        <input type="number" id="fb-gastado" placeholder="Gastado $" min="0" step="0.01" required>
        <input type="number" id="fb-leads" placeholder="Leads" min="0" required>
        <input type="number" id="fb-cpl-obj" placeholder="CPL objetivo $" min="0" step="0.01" required>
        <button type="submit">+ Agregar</button>
      </form>
      <table>
        <thead>
          <tr>
            <th>Campaña</th>
            <th>Fecha</th>
            <th>Presupuesto</th>
            <th>Gastado</th>
            <th>Leads</th>
            <th>CPL Real</th>
            <th>CPL Obj.</th>
            <th>Estado</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="fb-body"></tbody>
      </table>
    </section>

    <!-- RESUMEN -->
    <section id="resumen" class="panel">
      <h2>Resumen del Mes</h2>
      <div id="resumen-content"></div>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
