<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Mi Tiempo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#111;font-size:14px}
header{background:#fff;border-bottom:1px solid #e0e0e0;padding:12px 16px;position:sticky;top:0;z-index:30}
.nav-week{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav-week h1{font-size:15px;font-weight:700}
.nav-btn{background:none;border:1px solid #e0e0e0;border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit;touch-action:manipulation;color:#111}
.days-row{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.days-row::-webkit-scrollbar{display:none}
.day-tab{flex:1;min-width:44px;display:flex;flex-direction:column;align-items:center;padding:6px 4px;border-radius:10px;cursor:pointer;touch-action:manipulation;transition:background .15s;border:none;background:none;font-family:inherit}
.day-tab .dia-nom{font-size:10px;color:#999;font-weight:500;text-transform:uppercase}
.day-tab .dia-num{font-size:18px;font-weight:700;color:#111;line-height:1.2}
.day-tab.active{background:#111}
.day-tab.active .dia-nom{color:rgba(255,255,255,.7)}
.day-tab.active .dia-num{color:#fff}
.day-tab.hoy .dia-num{color:#1565c0}
.day-tab.active.hoy .dia-num{color:#fff}
.timeline{padding:8px 16px 80px}
.hour-slot{display:flex;gap:10px;margin-bottom:4px;min-height:56px;align-items:flex-start;cursor:pointer;touch-action:manipulation}
.hour-label{width:40px;padding-top:6px;font-size:11px;color:#bbb;font-weight:500;flex-shrink:0;text-align:right}
.slot-area{flex:1;position:relative}
.slot-line{position:absolute;top:14px;left:0;right:0;height:1px;background:#eeeeee}
.slot-card{background:#fff;border-radius:10px;padding:10px 12px;border:1px solid #e8e8e8;position:relative;min-height:44px;transition:border-color .15s}
.slot-card.empty{background:transparent;border:1px dashed #e0e0e0}
.slot-card.empty:hover,.slot-card.empty:active{border-color:#999;background:#fafafa}
.slot-card.done{border-color:#c8e6c9;background:#f1f8e9}
.slot-card.done .slot-text{color:#2e7d32}
.slot-check{position:absolute;right:10px;top:10px;width:20px;height:20px;border-radius:50%;border:2px solid #e0e0e0;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:all .15s}
.slot-card.done .slot-check{background:#2e7d32;border-color:#2e7d32;color:#fff}
.slot-title{font-size:13px;font-weight:600;color:#111;margin-bottom:2px;padding-right:28px}
.slot-text{font-size:12px;color:#888;line-height:1.4;padding-right:28px}
.slot-card.empty .slot-title{color:#ccc;font-weight:400}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:flex-end}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:24px 20px 40px;width:100%;animation:slideup .25s ease}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{font-size:16px;font-weight:700;margin-bottom:4px}
.modal .hora-label{font-size:12px;color:#888;margin-bottom:16px}
.modal input{width:100%;border:1px solid #e0e0e0;border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none;margin-bottom:10px}
.modal input:focus{border-color:#111}
.modal textarea{width:100%;border:1px solid #e0e0e0;border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;resize:none;height:80px;outline:none;margin-bottom:14px}
.modal textarea:focus{border-color:#111}
.modal-btns{display:flex;gap:8px}
.btn-done{flex:1;background:#2e7d32;color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;touch-action:manipulation}
.btn-clear{background:#f5f5f5;color:#888;border:none;border-radius:10px;padding:13px 16px;font-size:14px;cursor:pointer;font-family:inherit;touch-action:manipulation}
.btn-cancel{background:none;border:none;color:#888;padding:10px;font-size:13px;cursor:pointer;font-family:inherit;touch-action:manipulation;width:100%;text-align:center;margin-top:4px}
</style>
</head>
<body>
<header>
  <div class="nav-week">
    <button class="nav-btn" onclick="cambiarSemana(-1)">← Anterior</button>
    <h1 id="semana-label"></h1>
    <button class="nav-btn" onclick="cambiarSemana(1)">Siguiente →</button>
  </div>
  <div class="days-row" id="days-row"></div>
</header>
<div class="timeline" id="timeline"></div>
<div class="overlay" id="overlay" onclick="cerrarModal(event)">
  <div class="modal" id="modal">
    <h3 id="modal-titulo">Agregar actividad</h3>
    <div class="hora-label" id="modal-hora"></div>
    <input type="text" id="modal-input" placeholder="¿Qué harás o hiciste?">
    <textarea id="modal-desc" placeholder="Descripción (opcional)"></textarea>
    <div class="modal-btns">
      <button class="btn-clear" onclick="limpiarSlot()">Borrar</button>
      <button class="btn-done" onclick="guardarSlot()">✓ Completar</button>
    </div>
    <button class="btn-cancel" onclick="cerrarOverlay()">Cancelar</button>
  </div>
</div>
<script>
const DB={get:()=>JSON.parse(localStorage.getItem('mitiempo_v2')||'{}'),set:v=>localStorage.setItem('mitiempo_v2',JSON.stringify(v))};
const HORAS=[];for(let h=5;h<=23;h++)HORAS.push(h);
const DIAS_NOM=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
let semanaOffset=0,diaActivo=0,slotActual=null;
function lunesDe(offset){const hoy=new Date();const dow=hoy.getDay();const diff=(dow===0?-6:1-dow)+offset*7;const lun=new Date(hoy);lun.setDate(hoy.getDate()+diff);lun.setHours(0,0,0,0);return lun;}
function fechaDia(offset,idx){const lun=lunesDe(offset);lun.setDate(lun.getDate()+idx);return lun;}
function keySlot(fecha,hora){return fecha.toISOString().split('T')[0]+'_'+hora;}
function fmtHora(h){const ampm=h<12?'am':'pm';const h12=h%12===0?12:h%12;return h12+':00 '+ampm;}
function renderDias(){const lun=lunesDe(semanaOffset);const mes=lun.toLocaleDateString('es-MX',{month:'short',year:'numeric'});document.getElementById('semana-label').textContent=mes;const hoy=new Date();hoy.setHours(0,0,0,0);const row=document.getElementById('days-row');row.innerHTML='';for(let i=0;i<7;i++){const fecha=fechaDia(semanaOffset,i);const esHoy=fecha.getTime()===hoy.getTime();const nom=DIAS_NOM[fecha.getDay()];const num=fecha.getDate();const btn=document.createElement('button');btn.className='day-tab '+(i===diaActivo?'active ':'')+( esHoy?'hoy':'');btn.innerHTML='<span class="dia-nom">'+nom+'</span><span class="dia-num">'+num+'</span>';btn.onclick=(function(idx){return function(){diaActivo=idx;renderDias();renderTimeline();}})(i);row.appendChild(btn);}}
function renderTimeline(){const data=DB.get();const fecha=fechaDia(semanaOffset,diaActivo);const tl=document.getElementById('timeline');tl.innerHTML=HORAS.map(h=>{const key=keySlot(fecha,h);const slot=data[key];const done=slot&&slot.done;const title=slot&&slot.title||'';const desc=slot&&slot.desc||'';return '<div class="hour-slot" onclick="abrirModal(\''+key+'\','+h+')"><div class="hour-label">'+fmtHora(h)+'</div><div class="slot-area"><div class="slot-line"></div><div class="slot-card '+(done?'done ':'')+(!title?'empty':'')+'"><div class="slot-check">'+(done?'✓':'')+'</div><div class="slot-title">'+(title||'+ Agregar')+'</div>'+(desc?'<div class="slot-text">'+desc+'</div>':'')+'</div></div></div>';}).join('');}
function abrirModal(key,h){const data=DB.get();const slot=data[key]||{};slotActual=key;document.getElementById('modal-titulo').textContent=slot.title||'Agregar actividad';document.getElementById('modal-hora').textContent=fmtHora(h);document.getElementById('modal-input').value=slot.title||'';document.getElementById('modal-desc').value=slot.desc||'';document.getElementById('overlay').classList.add('open');setTimeout(()=>document.getElementById('modal-input').focus(),300);}
function cerrarOverlay(){document.getElementById('overlay').classList.remove('open');slotActual=null;}
function cerrarModal(e){if(e.target===document.getElementById('overlay'))cerrarOverlay();}
function guardarSlot(){if(!slotActual)return;const title=document.getElementById('modal-input').value.trim();if(!title)return;const data=DB.get();data[slotActual]={title,desc:document.getElementById('modal-desc').value.trim(),done:true};DB.set(data);cerrarOverlay();renderTimeline();}
function limpiarSlot(){if(!slotActual)return;const data=DB.get();delete data[slotActual];DB.set(data);cerrarOverlay();renderTimeline();}
function cambiarSemana(dir){semanaOffset+=dir;if(semanaOffset===0){const hoy=new Date();diaActivo=hoy.getDay()===0?6:hoy.getDay()-1;}renderDias();renderTimeline();}
(function init(){const hoy=new Date();diaActivo=hoy.getDay()===0?6:hoy.getDay()-1;renderDias();renderTimeline();})();
</script>
</body>
</html>
