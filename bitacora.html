<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Bitácora — La Jardín</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#fff;--surface:#f7f7f7;--border:#e4e4e4;--text:#111;--muted:#888;--accent:#111;--green:#1e6b1e;--red:#b52a2a}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:10}
header h1{font-size:14px;font-weight:600}
.fecha-hoy{font-size:12px;color:var(--muted)}
.input-area{padding:16px;border-bottom:1px solid var(--border);background:var(--surface)}
.input-row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:14px;font-family:inherit;resize:none;height:60px;background:var(--bg);color:var(--text);outline:none;line-height:1.5}
textarea:focus{border-color:var(--accent)}
.btn-log{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:0 18px;height:60px;font-size:20px;cursor:pointer;flex-shrink:0;touch-action:manipulation}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cat{border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--muted);cursor:pointer;background:var(--bg);touch-action:manipulation;transition:all .12s}
.cat.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.filter-bar{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;border-bottom:1px solid var(--border);scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.day-btn{border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:12px;white-space:nowrap;cursor:pointer;background:var(--bg);color:var(--muted);touch-action:manipulation}
.day-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.entries{padding:12px 16px;display:flex;flex-direction:column;gap:8px;padding-bottom:80px}
.entry{background:var(--surface);border-radius:8px;padding:12px;display:flex;gap:10px;align-items:flex-start}
.entry-time{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;padding-top:2px;min-width:44px}
.entry-body{flex:1}
.entry-cat{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.entry-text{font-size:14px;line-height:1.5;color:var(--text)}
.del{background:none;border:none;color:var(--border);font-size:18px;cursor:pointer;padding:0;line-height:1;transition:color .12s;touch-action:manipulation}
.del:hover{color:var(--red)}
.empty{text-align:center;padding:48px 24px;color:var(--muted);font-size:13px}
.export-btn{position:fixed;bottom:16px;right:16px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:8px 16px;font-size:12px;color:var(--muted);cursor:pointer;z-index:10;touch-action:manipulation}
.day-summary{font-size:11px;color:var(--muted);padding:6px 16px 0;text-align:right}
</style>
</head>
<body>
<header>
  <h1>Bitácora La Jardín</h1>
  <span class="fecha-hoy" id="fecha-hoy"></span>
</header>
<div class="input-area">
  <div class="input-row">
    <textarea id="txt" placeholder="¿Qué estás haciendo ahora?"></textarea>
    <button class="btn-log" onclick="logear()">+</button>
  </div>
  <div class="cats" id="cats">
    <div class="cat active" data-cat="general">General</div>
    <div class="cat" data-cat="venta">Venta</div>
    <div class="cat" data-cat="facebook">Facebook</div>
    <div class="cat" data-cat="gasto">Gasto</div>
    <div class="cat" data-cat="llamada">Llamada</div>
    <div class="cat" data-cat="obra">Obra</div>
    <div class="cat" data-cat="admin">Admin</div>
  </div>
</div>
<div class="filter-bar" id="filter-bar"></div>
<div class="day-summary" id="day-summary"></div>
<div class="entries" id="entries"></div>
<button class="export-btn" onclick="exportar()">Exportar día</button>
<script>
const DB={get:()=>JSON.parse(localStorage.getItem('bitacora')||'[]'),set:v=>localStorage.setItem('bitacora',JSON.stringify(v))};
let catActiva='general',diaActivo=hoy();
function hoy(){return new Date().toISOString().split('T')[0]}
function fmtFecha(d){const[y,m,dd]=d.split('-');const dias=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];const fecha=new Date(y,m-1,dd);return `${dias[fecha.getDay()]} ${dd}/${m}`}
function fmtHora(ts){const d=new Date(ts);return d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}
document.getElementById('fecha-hoy').textContent=new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
document.getElementById('cats').addEventListener('click',e=>{const cat=e.target.closest('.cat');if(!cat)return;document.querySelectorAll('.cat').forEach(c=>c.classList.remove('active'));cat.classList.add('active');catActiva=cat.dataset.cat;});
function logear(){const txt=document.getElementById('txt').value.trim();if(!txt)return;const entries=DB.get();entries.unshift({id:Date.now(),ts:Date.now(),date:hoy(),cat:catActiva,txt});DB.set(entries);document.getElementById('txt').value='';renderDias();renderEntradas();}
document.getElementById('txt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();logear();}});
function renderDias(){const entries=DB.get();const dias=[...new Set(entries.map(e=>e.date))].sort((a,b)=>b.localeCompare(a));if(!dias.includes(hoy()))dias.unshift(hoy());const bar=document.getElementById('filter-bar');bar.innerHTML=dias.slice(0,14).map(d=>`<button class="day-btn ${d===diaActivo?'active':''}" onclick="cambiarDia('${d}')">${d===hoy()?'Hoy':fmtFecha(d)}</button>`).join('');}
function cambiarDia(d){diaActivo=d;renderDias();renderEntradas();}
function renderEntradas(){const todas=DB.get().filter(e=>e.date===diaActivo);const cont=document.getElementById('entries');const summ=document.getElementById('day-summary');summ.textContent=todas.length?`${todas.length} entradas hoy`:'';if(!todas.length){cont.innerHTML=`<div class="empty">Sin entradas${diaActivo===hoy()?' hoy — empieza registrando':' este día'}.</div>`;return;}cont.innerHTML=todas.map(e=>`<div class="entry" id="e${e.id}"><div class="entry-time">${fmtHora(e.ts)}</div><div class="entry-body"><div class="entry-cat">${e.cat}</div><div class="entry-text">${e.txt.replace(/\n/g,'<br>')}</div></div><button class="del" onclick="borrar(${e.id})">×</button></div>`).join('');}
window.borrar=id=>{DB.set(DB.get().filter(e=>e.id!==id));renderEntradas();renderDias();};
function exportar(){const entries=DB.get().filter(e=>e.date===diaActivo);if(entries.length===0){alert('Sin entradas para exportar.');return;}const txt=`BITÁCORA — ${diaActivo}\n${'─'.repeat(40)}\n`+entries.map(e=>`[${fmtHora(e.ts)}] [${e.cat.toUpperCase()}] ${e.txt}`).join('\n');const a=document.createElement('a');a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(txt);a.download=`bitacora-${diaActivo}.txt`;a.click();}
renderDias();renderEntradas();
</script>
</body>
</html>
