<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>La Jardín — Pantalla Cliente</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;display:flex;flex-direction:column}

.header{background:#000;border-bottom:1px solid #222;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:22px;font-weight:900;color:#c9a84c;letter-spacing:2px}
.header-sub{font-size:12px;color:#444;letter-spacing:1px}

.pantalla-espera{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.logo-grande{font-size:64px;font-weight:900;color:#c9a84c;letter-spacing:4px;text-align:center;line-height:1}
.logo-sub{font-size:24px;font-weight:700;font-style:italic;color:#333;letter-spacing:2px}
.direccion{font-size:14px;color:#333;text-align:center;margin-top:8px}

.pantalla-venta{flex:1;display:none;flex-direction:column}
.items-lista{flex:1;padding:20px 24px;overflow-y:auto}
.item-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #1a1a1a}
.item-row:last-child{border-bottom:none}
.item-left .nombre{font-size:16px;font-weight:700}
.item-left .detalle{font-size:12px;color:#555;margin-top:2px}
.item-right{text-align:right}
.item-right .qty{font-size:12px;color:#555;margin-bottom:2px}
.item-right .importe{font-size:18px;font-weight:900;color:#c9a84c}

.total-bar{background:#111;border-top:1px solid #222;padding:20px 24px;display:flex;justify-content:space-between;align-items:center}
.total-lbl{font-size:18px;font-weight:700;color:#666;letter-spacing:2px}
.total-num{font-size:48px;font-weight:900;color:#c9a84c}

.footer{background:#000;padding:10px 24px;text-align:center;font-size:11px;color:#333;letter-spacing:1px}
</style>
</head>
<body>

<div class="header">
  <div class="brand">MADERERÍA LA JARDÍN</div>
  <div class="header-sub" id="hora"></div>
</div>

<div class="pantalla-espera" id="espera">
  <div>
    <div class="logo-grande">LA<br>JARDÍN</div>
    <div class="logo-sub">Maderería</div>
  </div>
  <div class="direccion">Nogal 3516, Col. Ciudad Jardín, Tijuana, B.C.<br>WhatsApp 664 709 3835</div>
</div>

<div class="pantalla-venta" id="venta">
  <div class="items-lista" id="items-lista"></div>
  <div class="total-bar">
    <div class="total-lbl">TOTAL</div>
    <div class="total-num" id="total-num">$0.00</div>
  </div>
</div>

<div class="footer">GRACIAS POR SU PREFERENCIA — TIJUANA & ROSARITO</div>

<script>
const socket = io();

socket.on('carrito_cliente', data => {
  if (!data.items || !data.items.length) {
    mostrarEspera();
    return;
  }
  document.getElementById('espera').style.display = 'none';
  const venta = document.getElementById('venta');
  venta.style.display = 'flex';

  document.getElementById('items-lista').innerHTML = data.items.map(i => `
    <div class="item-row">
      <div class="item-left">
        <div class="nombre">${i.nombre}</div>
        <div class="detalle">${i.medida} — $${i.precio.toLocaleString('es-MX',{minimumFractionDigits:2})} c/u</div>
      </div>
      <div class="item-right">
        <div class="qty">× ${i.qty}</div>
        <div class="importe">$${(i.precio*i.qty).toLocaleString('es-MX',{minimumFractionDigits:2})}</div>
      </div>
    </div>
  `).join('');

  document.getElementById('total-num').textContent = '$' + data.total.toLocaleString('es-MX',{minimumFractionDigits:2});
});

socket.on('limpiar_cliente', mostrarEspera);

function mostrarEspera() {
  document.getElementById('espera').style.display = 'flex';
  document.getElementById('venta').style.display = 'none';
}

setInterval(() => {
  document.getElementById('hora').textContent = new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
}, 1000);
</script>
</body>
</html>
