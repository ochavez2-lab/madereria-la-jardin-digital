<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Maderería La Jardín — Catálogo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f7f4ee;color:#1a1a1a;min-height:100vh}

/* HERO TOPBAR */
.hero{background:#1a1a1a;padding:28px 32px 24px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,#c9a84c18,transparent 60%);pointer-events:none}
.hero-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo-w{display:flex;align-items:center;gap:16px}
.logo-icon{font-size:36px}
.logo-text .t1{font-family:'Playfair Display',serif;font-size:clamp(22px,4vw,36px);font-weight:900;color:#c9a84c;letter-spacing:3px;line-height:1}
.logo-text .t2{font-size:11px;color:#666;letter-spacing:3px;margin-top:4px}
.hero-contact{text-align:right}
.hero-contact div{font-size:12px;color:#666;margin-bottom:4px}
.hero-contact a{color:#c9a84c;text-decoration:none;font-weight:700;font-size:13px}

/* SEARCH + CATS */
.controls{background:#fff;border-bottom:1px solid #ede6d8;padding:14px 24px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px #0000000a}
.controls-inner{max-width:1100px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:180px}
.search-wrap input{width:100%;background:#f7f4ee;border:1.5px solid #e0d8c8;border-radius:10px;padding:9px 14px 9px 36px;font-size:13px;font-family:inherit;outline:none;color:#1a1a1a;transition:border-color .2s}
.search-wrap input:focus{border-color:#c9a84c}
.search-wrap::before{content:'🔍';position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.cats::-webkit-scrollbar{display:none}
.cat{padding:7px 16px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;border:1.5px solid #e0d8c8;background:#f7f4ee;color:#999;white-space:nowrap;transition:all .15s}
.cat.on{background:#c9a84c;color:#fff;border-color:#c9a84c}
.cat:hover:not(.on){border-color:#c9a84c;color:#c9a84c}

/* GRID */
.main{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
.section-label{font-size:10px;font-weight:700;color:#bbb;letter-spacing:2px;margin-bottom:16px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:500px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:768px){.grid{grid-template-columns:repeat(4,1fr);gap:18px}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(5,1fr)}}

.card{background:#fff;border:1.5px solid #ede6d8;border-radius:16px;overflow:hidden;transition:all .2s;cursor:default}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 32px #c9a84c18;border-color:#c9a84c66}
.card-img{width:100%;aspect-ratio:1;background:linear-gradient(135deg,#f5f0e8,#ede6d8);display:flex;align-items:center;justify-content:center;font-size:52px;overflow:hidden;position:relative}
.card-img img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.card-cat{position:absolute;top:8px;left:8px;background:#1a1a1a99;color:#c9a84c;font-size:9px;font-weight:700;letter-spacing:1px;padding:3px 7px;border-radius:6px;backdrop-filter:blur(4px)}
.card-body{padding:12px}
.card-nom{font-weight:800;font-size:13px;color:#1a1a1a;line-height:1.3;margin-bottom:2px}
.card-med{font-size:11px;color:#aaa;margin-bottom:8px}
.card-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:4px}
.card-price{font-family:'Playfair Display',serif;font-size:clamp(18px,3vw,22px);font-weight:900;color:#c9a84c;line-height:1}
.card-price-sub{font-size:9px;color:#bbb;margin-top:2px}
.badge{font-size:9px;font-weight:700;padding:3px 7px;border-radius:6px}
.s-ok{background:#dcfce7;color:#16a34a}
.s-no{background:#fee2e2;color:#dc2626}
.s-na{background:#f5f0e8;color:#aaa}

.empty{text-align:center;color:#bbb;padding:80px 20px;font-size:14px;grid-column:1/-1}

/* FOOTER */
.footer{background:#1a1a1a;padding:20px 24px;text-align:center}
.footer p{font-size:11px;color:#555;letter-spacing:2px}

/* ADMIN BTN — solo desktop */
.admin-btn{display:none}
@media(min-width:768px){
  .admin-btn{display:flex;position:fixed;bottom:20px;right:20px;width:36px;height:36px;background:#1a1a1a;border:1px solid #333;border-radius:50%;align-items:center;justify-content:center;cursor:pointer;font-size:14px;opacity:.35;transition:opacity .2s;z-index:100}
  .admin-btn:hover{opacity:1}
}

/* LOGIN MODAL */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.modal{background:#fff;border-radius:20px;padding:32px 28px;width:100%;max-width:300px;text-align:center;box-shadow:0 32px 80px #0000002a}
.modal h3{font-family:'Playfair Display',serif;font-size:22px;color:#c9a84c;margin-bottom:4px}
.modal p{font-size:12px;color:#aaa;margin-bottom:20px}
.pwd{width:100%;background:#f7f4ee;border:1.5px solid #e0d8c8;border-radius:12px;padding:13px;font-size:16px;font-family:inherit;outline:none;text-align:center;letter-spacing:6px;margin-bottom:12px;color:#1a1a1a}
.pwd:focus{border-color:#c9a84c}
.btn-e{width:100%;background:linear-gradient(135deg,#c9a84c,#e0c060);color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:900;cursor:pointer;font-family:inherit}
.btn-c{width:100%;background:none;border:none;color:#bbb;padding:8px;cursor:pointer;font-size:12px;font-family:inherit;margin-top:4px}
.err{color:#ef4444;font-size:12px;margin-top:8px;min-height:16px}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div class="logo-w">
      <div class="logo-icon">🪵</div>
      <div class="logo-text">
        <div class="t1">LA JARDÍN</div>
        <div class="t2">MADERERÍA · TIJUANA & ROSARITO</div>
      </div>
    </div>
    <div class="hero-contact">
      <div>📍 Nogal 3516, Col. Ciudad Jardín</div>
      <a href="tel:6647093835">📞 664 709 3835</a>
    </div>
  </div>
</div>

<div class="controls">
  <div class="controls-inner">
    <div class="search-wrap">
      <input type="text" id="buscar" placeholder="Buscar producto..." oninput="render()">
    </div>
    <div class="cats" id="cats"></div>
  </div>
</div>

<div class="main">
  <div class="section-label" id="section-label"></div>
  <div class="grid" id="grid"></div>
</div>

<div class="footer">
  <p>MADERERÍA LA JARDÍN · TIJUANA & ROSARITO · 664 709 3835</p>
</div>

<div class="admin-btn" onclick="abrirAdmin()" title="Administración">⚙️</div>

<div class="ov" id="ov-login">
  <div class="modal">
    <h3>ADMIN</h3>
    <p>Ingresa tu contraseña</p>
    <input class="pwd" type="password" id="pwd" placeholder="••••••" onkeydown="if(event.key==='Enter')entrar()">
    <button class="btn-e" onclick="entrar()">ENTRAR</button>
    <button class="btn-c" onclick="document.getElementById('ov-login').classList.remove('on')">Cancelar</button>
    <div class="err" id="err"></div>
  </div>
</div>

<script>
let prods=[], catAct='';

async function init(){
  try{ prods=await fetch('/api/catalogo').then(r=>r.json()); }catch(e){ prods=[]; }
  const cats=['Todo',...new Set(prods.map(p=>p.categoria||'General'))];
  document.getElementById('cats').innerHTML=cats.map((c,i)=>`<div class="cat${i===0?' on':''}" onclick="filtrar('${c}',this)">${c}</div>`).join('');
  render();
}

function filtrar(cat,el){
  catAct=cat==='Todo'?'':cat;
  document.querySelectorAll('.cat').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  render();
}

function render(){
  const q=document.getElementById('buscar').value.toLowerCase();
  let lista=catAct?prods.filter(p=>(p.categoria||'General')===catAct):prods;
  if(q) lista=lista.filter(p=>p.nombre.toLowerCase().includes(q)||p.medida.toLowerCase().includes(q));
  const n=lista.length;
  document.getElementById('section-label').textContent=n+' producto'+(n!==1?'s':'')+(catAct?' — '+catAct:'');
  document.getElementById('grid').innerHTML=lista.length
    ?lista.map(p=>`<div class="card">
        <div class="card-img">
          ${p.foto?`<img src="${p.foto}" alt="${p.nombre}">`:'🪵'}
          <div class="card-cat">${p.categoria||'General'}</div>
        </div>
        <div class="card-body">
          <div class="card-nom">${p.nombre}</div>
          <div class="card-med">${p.medida}</div>
          <div class="card-bottom">
            <div><div class="card-price">$${p.precio.toLocaleString('es-MX')}</div><div class="card-price-sub">MXN / pieza</div></div>
            <span class="badge ${p.cantidad!=null?(p.cantidad>0?'s-ok':'s-no'):'s-na'}">${p.cantidad!=null?(p.cantidad>0?p.cantidad+' pzs':'Agotado'):'Disponible'}</span>
          </div>
        </div>
      </div>`).join('')
    :'<div class="empty">Sin productos</div>';
}

function abrirAdmin(){
  document.getElementById('pwd').value='';
  document.getElementById('err').textContent='';
  document.getElementById('ov-login').classList.add('on');
  setTimeout(()=>document.getElementById('pwd').focus(),100);
}

async function entrar(){
  const pwd=document.getElementById('pwd').value;
  try{
    const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'admin',password:pwd})});
    if(!res.ok){document.getElementById('err').textContent='Contraseña incorrecta';return;}
    const{token}=await res.json();
    sessionStorage.setItem('token',token);sessionStorage.setItem('role','admin');
    window.location.href='/admin.html';
  }catch(e){document.getElementById('err').textContent='Error de conexión';}
}

init();
</script>
</body>
</html>
