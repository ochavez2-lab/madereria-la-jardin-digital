<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Maderería La Jardín — Acceso</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.logo{text-align:center;margin-bottom:48px}
.logo-t{font-size:52px;font-weight:900;color:#c9a84c;letter-spacing:4px;line-height:1}
.logo-s{font-size:16px;color:#444;letter-spacing:3px;margin-top:8px;text-transform:uppercase}
.roles{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.role-card{width:170px;background:#111;border:2px solid #222;border-radius:18px;padding:32px 20px;text-align:center;cursor:pointer;transition:all .2s;user-select:none}
.role-card:hover{border-color:#c9a84c;background:#1a1a1a;transform:translateY(-6px)}
.role-card:active{transform:scale(.97)}
.role-icon{font-size:36px;margin-bottom:14px}
.role-name{font-size:15px;font-weight:900;letter-spacing:2px}
.role-desc{font-size:11px;color:#555;margin-top:6px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:10;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:#111;border:1px solid #2a2a2a;border-radius:18px;padding:36px 28px;width:320px;text-align:center}
.modal-title{font-size:20px;font-weight:900;color:#c9a84c;letter-spacing:2px;margin-bottom:6px}
.modal-sub{font-size:12px;color:#555;margin-bottom:24px}
.pwd-input{width:100%;background:#0a0a0a;border:1px solid #333;border-radius:10px;padding:14px;color:#fff;font-size:16px;font-family:inherit;outline:none;text-align:center;letter-spacing:4px;margin-bottom:14px}
.pwd-input:focus{border-color:#c9a84c}
.btn-enter{width:100%;background:#c9a84c;color:#000;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;letter-spacing:1px}
.btn-enter:hover{background:#e0c060}
.btn-cancel{width:100%;background:none;border:none;color:#444;padding:10px;cursor:pointer;font-size:13px;font-family:inherit;margin-top:6px}
.btn-cancel:hover{color:#888}
.err{color:#ef4444;font-size:12px;margin-top:10px;min-height:18px}
.footer{position:fixed;bottom:16px;font-size:11px;color:#222;letter-spacing:2px;text-align:center}
</style>
</head>
<body>

<div class="logo">
  <div class="logo-t">LA JARDÍN</div>
  <div class="logo-s">Punto de Venta</div>
</div>

<div class="roles">
  <div class="role-card" onclick="abrir('admin')">
    <div class="role-icon">⚙️</div>
    <div class="role-name">ADMIN</div>
    <div class="role-desc">Gestión completa</div>
  </div>
  <div class="role-card" onclick="abrir('cajero')">
    <div class="role-icon">🛒</div>
    <div class="role-name">CAJERO</div>
    <div class="role-desc">Ventas y cobros</div>
  </div>
  <div class="role-card" onclick="abrir('cliente')">
    <div class="role-icon">📺</div>
    <div class="role-name">CLIENTE</div>
    <div class="role-desc">Pantalla de compra</div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-title" id="modal-title">ADMIN</div>
    <div class="modal-sub">Ingresa tu contraseña</div>
    <input class="pwd-input" type="password" id="pwd" placeholder="••••••" onkeydown="if(event.key==='Enter')entrar()">
    <button class="btn-enter" onclick="entrar()">ENTRAR</button>
    <button class="btn-cancel" onclick="cerrar()">Cancelar</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div class="footer">MADERERÍA LA JARDÍN · TIJUANA & ROSARITO</div>

<script>
const destinos = { admin:'/admin.html', cajero:'/cajero.html', cliente:'/cliente.html' };
const nombres  = { admin:'ADMIN', cajero:'CAJERO', cliente:'CLIENTE' };
let rol = '';

function abrir(r) {
  rol = r;
  document.getElementById('modal-title').textContent = nombres[r];
  document.getElementById('pwd').value = '';
  document.getElementById('err').textContent = '';
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('pwd').focus(), 100);
}
function cerrar() { document.getElementById('overlay').classList.remove('open'); }

async function entrar() {
  const pwd = document.getElementById('pwd').value;
  document.getElementById('err').textContent = '';
  try {
    const res = await fetch('/api/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ role: rol, password: pwd })
    });
    if (!res.ok) { document.getElementById('err').textContent = 'Contraseña incorrecta'; return; }
    const { token } = await res.json();
    sessionStorage.setItem('token', token);
    sessionStorage.setItem('role', rol);
    window.location.href = destinos[rol];
  } catch(e) { document.getElementById('err').textContent = 'Error de conexión'; }
}
</script>
</body>
</html>
