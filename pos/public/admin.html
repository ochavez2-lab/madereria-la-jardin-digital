<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin — La Jardín</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
.topbar{background:#000;border-bottom:1px solid #1a1a1a;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:10}
.brand{font-size:14px;font-weight:900;color:#c9a84c;letter-spacing:2px}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tab{padding:8px 16px;font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer;border-radius:8px;color:#555;border:none;background:none;font-family:inherit;white-space:nowrap;transition:all .15s}
.tab.active,.tab:hover{color:#fff;background:#1a1a1a}
.tab.active{color:#c9a84c}
.logout{font-size:12px;cursor:pointer;padding:6px 12px;border:1px solid #222;border-radius:8px;background:none;color:#555;font-family:inherit}
.logout:hover{color:#ef4444;border-color:#ef4444}
.panel{display:none;padding:20px;max-width:1100px;margin:0 auto}
.panel.active{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:24px}
.kpi{background:#111;border:1px solid #1a1a1a;border-radius:14px;padding:18px 20px}
.kpi-lbl{font-size:11px;color:#555;letter-spacing:1px;margin-bottom:6px}
.kpi-val{font-size:28px;font-weight:900;color:#c9a84c}
.kpi-sub{font-size:11px;color:#444;margin-top:4px}
.section-title{font-size:13px;font-weight:700;color:#888;letter-spacing:2px;margin-bottom:12px;text-transform:uppercase}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#111;color:#555;font-size:11px;font-weight:700;letter-spacing:1px;padding:10px 12px;text-align:left;border-bottom:1px solid #1a1a1a}
td{padding:10px 12px;border-bottom:1px solid #111;vertical-align:middle}
tr:hover td{background:#0f0f0f}
.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700}
.badge-green{background:#0a2e0a;color:#4ade80}
.badge-red{background:#2e0a0a;color:#f87171}
.btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:none;letter-spacing:.5px;transition:all .15s}
.btn-gold{background:#c9a84c;color:#000}
.btn-gold:hover{background:#e0c060}
.btn-outline{background:none;border:1px solid #333;color:#888}
.btn-outline:hover{border-color:#888;color:#fff}
.btn-danger{background:none;border:1px solid #333;color:#555}
.btn-danger:hover{background:#2e0a0a;border-color:#ef4444;color:#ef4444}
.btn-sm{padding:4px 10px;font-size:11px}
.edit-input{background:#1a1a1a;border:1px solid #333;border-radius:6px;padding:5px 8px;color:#fff;font-size:13px;font-family:inherit;outline:none;width:80px}
.edit-input:focus{border-color:#c9a84c}
.edit-input.wide{width:140px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:#111;border:1px solid #2a2a2a;border-radius:16px;padding:28px;width:380px}
.modal h3{font-size:16px;font-weight:900;color:#c9a84c;margin-bottom:20px}
.form-row{margin-bottom:12px}
.form-label{font-size:11px;color:#555;letter-spacing:1px;margin-bottom:4px;display:block}
.form-input{width:100%;background:#0a0a0a;border:1px solid #333;border-radius:8px;padding:10px 12px;color:#fff;font-size:14px;font-family:inherit;outline:none}
.form-input:focus{border-color:#c9a84c}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.rem-items{font-size:11px;color:#555}
.total-gold{color:#c9a84c;font-weight:900}
.config-section{background:#111;border:1px solid #1a1a1a;border-radius:14px;padding:20px;margin-bottom:16px;max-width:480px}
.config-section h4{font-size:13px;font-weight:700;color:#888;letter-spacing:1px;margin-bottom:14px}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">LA JARDÍN — ADMIN</div>
  <div class="tabs">
    <button class="tab active" onclick="showPanel('hoy',this)">HOY</button>
    <button class="tab" onclick="showPanel('productos',this)">PRODUCTOS</button>
    <button class="tab" onclick="showPanel('clientes',this)">CLIENTES</button>
    <button class="tab" onclick="showPanel('historial',this)">HISTORIAL</button>
    <button class="tab" onclick="showPanel('config',this)">CONFIG</button>
  </div>
  <button class="logout" onclick="salir()">Salir</button>
</div>
<div class="panel active" id="panel-hoy">
  <div style="margin-bottom:20px;padding-top:8px"><div style="font-size:11px;color:#444;letter-spacing:1px" id="fecha-hoy"></div></div>
  <div class="kpis" id="kpis"></div>
  <div class="section-title">Ventas de hoy</div>
  <table><thead><tr><th>N°</th><th>HORA</th><th>CLIENTE</th><th>PRODUCTOS</th><th>TOTAL</th><th></th></tr></thead><tbody id="body-hoy"></tbody></table>
</div>
<div class="panel" id="panel-productos">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-top:8px">
    <div class="section-title" style="margin:0">Catálogo de productos</div>
    <button class="btn btn-gold" onclick="abrirNuevoProducto()">+ Nuevo producto</button>
  </div>
  <table><thead><tr><th>#</th><th>NOMBRE</th><th>MEDIDA</th><th>PRECIO</th><th>STOCK</th><th>ACCIONES</th></tr></thead><tbody id="body-productos"></tbody></table>
</div>
<div class="panel" id="panel-clientes">
  <div style="margin-bottom:16px;padding-top:8px" class="section-title">Clientes registrados</div>
  <table><thead><tr><th>NOMBRE</th><th>TELÉFONO</th><th>COMPRAS</th><th>TOTAL GASTADO</th><th>ÚTIMA VISITA</th></tr></thead><tbody id="body-clientes"></tbody></table>
</div>
<div class="panel" id="panel-historial">
  <div style="display:flex;gap:10px;align-items:center;margin-bottom:16px;padding-top:8px;flex-wrap:wrap">
    <div class="section-title" style="margin:0">Historial de remisiones</div>
    <input type="date" id="filtro-fecha" class="edit-input wide" onchange="cargarHistorial()">
  </div>
  <table><thead><tr><th>N°</th><th>FECHA</th><th>CLIENTE</th><th>PRODUCTOS</th><th>TOTAL</th><th></th></tr></thead><tbody id="body-historial"></tbody></table>
</div>
<div class="panel" id="panel-config">
  <div style="margin-bottom:20px;padding-top:8px" class="section-title">Configuración del sistema</div>
  <div class="config-section">
    <h4>CONTRASEÑAS</h4>
    <div class="form-row"><label class="form-label">Admin</label><input class="form-input" id="pwd-admin" type="password" placeholder="Nueva contraseña admin"></div>
    <div class="form-row"><label class="form-label">Cajero</label><input class="form-input" id="pwd-cajero" type="password" placeholder="Nueva contraseña cajero"></div>
    <div class="form-row"><label class="form-label">Cliente (pantalla)</label><input class="form-input" id="pwd-cliente" type="password" placeholder="Nueva contraseña cliente"></div>
    <button class="btn btn-gold" style="margin-top:4px" onclick="guardarPasswords()">Guardar contraseñas</button>
    <div id="msg-config" style="font-size:12px;color:#4ade80;margin-top:8px;min-height:16px"></div>
  </div>
</div>
<div class="overlay" id="overlay-prod">
  <div class="modal">
    <h3 id="modal-prod-title">Nuevo producto</h3>
    <input type="hidden" id="prod-id">
    <div class="form-row"><label class="form-label">Nombre</label><input class="form-input" id="prod-nombre" placeholder="Ej: Barrote 2x4"></div>
    <div class="form-row"><label class="form-label">Medida</label><input class="form-input" id="prod-medida" placeholder="Ej: 16 pies"></div>
    <div class="form-row"><label class="form-label">Precio ($MXN)</label><input class="form-input" id="prod-precio" type="number" placeholder="0"></div>
    <div class="modal-actions"><button class="btn btn-gold" onclick="guardarProducto()">Guardar</button><button class="btn btn-outline" onclick="cerrarModal()">Cancelar</button></div>
  </div>
</div>
<script>
const token = sessionStorage.getItem('token');
if (!token) window.location.href = '/';
const H = (url, opts={}) => fetch(url, { ...opts, headers:{ 'Content-Type':'application/json','x-token':token, ...(opts.headers||{}) } });
function showPanel(id, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  btn.classList.add('active');
  if (id==='hoy') cargarHoy();
  if (id==='productos') cargarProductos();
  if (id==='clientes') cargarClientes();
  if (id==='historial') cargarHistorial();
}
function salir() { sessionStorage.clear(); window.location.href = '/'; }
async function cargarHoy() {
  document.getElementById('fecha-hoy').textContent = new Date().toLocaleDateString('es-MX',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).toUpperCase();
  const [rep, db] = await Promise.all([H('/api/reportes/hoy').then(r=>r.json()), H('/api/remisiones').then(r=>r.json())]);
  document.getElementById('kpis').innerHTML = `<div class="kpi"><div class="kpi-lbl">TOTAL DEL DÍA</div><div class="kpi-val">$${rep.total.toLocaleString('es-MX',{minimumFractionDigits:2})}</div></div><div class="kpi"><div class="kpi-lbl">VENTAS</div><div class="kpi-val">${rep.count}</div><div class="kpi-sub">remisiones generadas</div></div><div class="kpi"><div class="kpi-lbl">PRODUCTO TOP</div><div class="kpi-val" style="font-size:16px;line-height:1.3">${rep.top}</div><div class="kpi-sub">${rep.topQty} piezas</div></div><div class="kpi"><div class="kpi-lbl">TICKET PROMEDIO</div><div class="kpi-val">$${rep.count?Math.round(rep.total/rep.count).toLocaleString('es-MX'):'0'}</div></div>`;
  const hoy = new Date().toDateString();
  const hoyR = (db.remisiones||[]).filter(r => new Date(r.fecha).toDateString() === hoy);
  document.getElementById('body-hoy').innerHTML = hoyR.length ? hoyR.map(r => `<tr><td style="color:#555">N°${String(r.id).padStart(4,'0')}</td><td>${new Date(r.fecha).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</td><td>${r.cliente}</td><td class="rem-items">${r.items.map(i=>i.nombre+' ×'+i.qty).join(', ')}</td><td class="total-gold">$${r.total.toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td><button class="btn btn-danger btn-sm" onclick="anular(${r.id})">Anular</button></td></tr>`).join('') : '<tr><td colspan="6" style="text-align:center;color:#333;padding:30px">Sin ventas hoy</td></tr>';
}
async function anular(id) { if (!confirm('¿Anular esta remisión?')) return; await H(`/api/remisiones/${id}`, { method:'DELETE' }); cargarHoy(); }
async function cargarProductos() {
  const prods = await H('/api/productos').then(r=>r.json());
  document.getElementById('body-productos').innerHTML = prods.map(p => `<tr><td style="color:#333">${p.id}</td><td style="font-weight:700">${p.nombre}</td><td style="color:#666">${p.medida}</td><td class="total-gold">$${p.precio}</td><td><span class="badge ${p.stock?'badge-green':'badge-red'}">${p.stock?'En stock':'Sin stock'}</span></td><td style="display:flex;gap:6px"><button class="btn btn-outline btn-sm" onclick="editarProducto(${p.id})">Editar</button><button class="btn btn-outline btn-sm" onclick="toggleStock(${p.id},${!p.stock})">${p.stock?'Ocultar':'Mostrar'}</button><button class="btn btn-danger btn-sm" onclick="eliminarProducto(${p.id})">Eliminar</button></td></tr>`).join('');
}
let prodCache = [];
async function editarProducto(id) {
  prodCache = await H('/api/productos').then(r=>r.json());
  const p = prodCache.find(x=>x.id===id);
  if (!p) return;
  document.getElementById('modal-prod-title').textContent = 'Editar producto';
  document.getElementById('prod-id').value = p.id;
  document.getElementById('prod-nombre').value = p.nombre;
  document.getElementById('prod-medida').value = p.medida;
  document.getElementById('prod-precio').value = p.precio;
  document.getElementById('overlay-prod').classList.add('open');
}
function abrirNuevoProducto() {
  document.getElementById('modal-prod-title').textContent = 'Nuevo producto';
  document.getElementById('prod-id').value = '';
  document.getElementById('prod-nombre').value = '';
  document.getElementById('prod-medida').value = '';
  document.getElementById('prod-precio').value = '';
  document.getElementById('overlay-prod').classList.add('open');
}
function cerrarModal() { document.getElementById('overlay-prod').classList.remove('open'); }
async function guardarProducto() {
  const id = document.getElementById('prod-id').value;
  const body = { nombre: document.getElementById('prod-nombre').value.trim(), medida: document.getElementById('prod-medida').value.trim(), precio: parseFloat(document.getElementById('prod-precio').value) };
  if (!body.nombre || !body.medida || isNaN(body.precio)) { alert('Completa todos los campos'); return; }
  if (id) { await H(`/api/productos/${id}`, { method:'PUT', body: JSON.stringify(body) }); } else { await H('/api/productos', { method:'POST', body: JSON.stringify(body) }); }
  cerrarModal(); cargarProductos();
}
async function toggleStock(id, val) { await H(`/api/productos/${id}`, { method:'PUT', body: JSON.stringify({ stock: val }) }); cargarProductos(); }
async function eliminarProducto(id) { if (!confirm('¿Eliminar este producto del catálogo?')) return; await H(`/api/productos/${id}`, { method:'DELETE' }); cargarProductos(); }
async function cargarClientes() {
  const clientes = await H('/api/clientes').then(r=>r.json());
  document.getElementById('body-clientes').innerHTML = clientes.length ? clientes.map(c => `<tr><td style="font-weight:700">${c.nombre}</td><td style="color:#666">${c.tel}</td><td style="text-align:center">${c.compras}</td><td class="total-gold">$${(c.total||0).toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td style="color:#555">${c.ultima ? new Date(c.ultima).toLocaleDateString('es-MX') : '—'}</td></tr>`).join('') : '<tr><td colspan="5" style="text-align:center;color:#333;padding:30px">Sin clientes registrados aún</td></tr>';
}
async function cargarHistorial() {
  const db = await H('/api/remisiones').then(r=>r.json());
  const filtro = document.getElementById('filtro-fecha').value;
  let rems = db.remisiones || [];
  if (filtro) rems = rems.filter(r => r.fecha.startsWith(filtro));
  document.getElementById('body-historial').innerHTML = rems.length ? rems.map(r => `<tr><td style="color:#555">N°${String(r.id).padStart(4,'0')}</td><td style="color:#666">${new Date(r.fecha).toLocaleDateString('es-MX')} ${new Date(r.fecha).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</td><td>${r.cliente}${r.tel?`<br><span style="font-size:11px;color:#555">${r.tel}</span>`:''}</td><td class="rem-items">${r.items.map(i=>i.nombre+' '+i.medida+' ×'+i.qty).join(', ')}</td><td class="total-gold">$${r.total.toLocaleString('es-MX',{minimumFractionDigits:2})}</td><td><button class="btn btn-danger btn-sm" onclick="anularHist(${r.id})">Anular</button></td></tr>`).join('') : '<tr><td colspan="6" style="text-align:center;color:#333;padding:30px">Sin remisiones</td></tr>';
}
async function anularHist(id) { if (!confirm('¿Anular esta remisión?')) return; await H(`/api/remisiones/${id}`, { method:'DELETE' }); cargarHistorial(); }
async function guardarPasswords() {
  const body = {};
  const a = document.getElementById('pwd-admin').value.trim();
  const c = document.getElementById('pwd-cajero').value.trim();
  const cl = document.getElementById('pwd-cliente').value.trim();
  if (a) body.admin = a;
  if (c) body.cajero = c;
  if (cl) body.cliente = cl;
  if (!Object.keys(body).length) return;
  await H('/api/config/passwords', { method:'PUT', body: JSON.stringify(body) });
  document.getElementById('msg-config').textContent = 'Contraseñas actualizadas';
  document.getElementById('pwd-admin').value = '';
  document.getElementById('pwd-cajero').value = '';
  document.getElementById('pwd-cliente').value = '';
  setTimeout(() => document.getElementById('msg-config').textContent = '', 3000);
}
cargarHoy();
setInterval(cargarHoy, 30000);
</script>
</body>
</html>
